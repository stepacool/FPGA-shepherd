name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync
        run: uv sync
      - name: Ruff
        run: uv run ruff check src tests
      - name: Pytest
        env:
          # Stable CLI help text in assertions; ignore any host color defaults.
          NO_COLOR: "1"
          TERM: dumb
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: uv run pytest -q -m "not toolchain"
