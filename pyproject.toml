[project]
name = "fpga-shepherd"
version = "0.1.0"
description = "Shepherd: set up, build, flash and diagnose FPGA projects (Tang Nano 9K) with one CLI."
readme = "README.md"
authors = [
    { name = "Stepan Filonov", email = "stepanfilonov@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "apio>=1.6,<2",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "rich>=14.0.0",
    "typer>=0.27.3",
]

[project.scripts]
shepherd = "shepherd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shepherd"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
